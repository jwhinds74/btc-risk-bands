name: BTC Risk Bands Collector

on:
  schedule:
    - cron: '40 0 * * *'       # 00:40 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - run: python collect_data.py
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
      - run: |
          git config user.name xgbit-bot
          git config user.email bot@xgbit
          git add *_cache.csv || true
          git commit -m "data: $(date -u +%F)" || true
          git pull --rebase --autostash || true
          git push
