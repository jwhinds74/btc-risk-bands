name: BTC Risk Bands Monitor

on:
  schedule:
    - cron: '0 1 * * *'        # 01:00 UTC — 20 min despues del colector
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy ruptures
      - run: python monitor.py
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name xgbit-bot
          git config user.email bot@xgbit
          git add monitoring/health_log.csv monitoring/last_forecast.json btc_ohlcv_cache.csv || true
          git commit -m "monitor: $(date -u +%F)" || true
          git pull --rebase --autostash || true
          git push
