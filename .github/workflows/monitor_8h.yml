name: BTC Risk Bands Monitor (8h)

# 3 corridas al dia, una por barra cerrada de 8h (+unos minutos de margen
# para que el proveedor publique el cierre). Si el monitor corriera una sola vez
# al dia, la mayoria de las bandas emitidas nunca se evaluarian y el track
# record intradiario no significaria nada.
on:
  schedule:
    - cron: '7 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:                      # evita que dos corridas choquen en el push
  group: monitor-8h
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      BAR_INTERVAL: '8h'
      ALERTS_NEWS: '0'            # la busqueda web solo en la corrida diaria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy ruptures groq
      - run: python monitor.py
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name xgbit-bot
          git config user.email bot@xgbit
          git add monitoring/health_log_8h.csv monitoring/last_forecast_8h.json monitoring/last_run_8h.json btc_ohlcv_cache_8h.csv || true
          git commit -m "monitor 8h: $(date -u +'%F %H:%M')" || true
          git pull --rebase --autostash || true
          git push
